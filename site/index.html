<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1.5' fill='%232a78d6'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.5' fill='%23eb6834'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.5' fill='%231baf7a'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%23898781'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply a saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <h1 id="site-title">Dashboard</h1>
    <div class="top-actions">
      <span id="generated" class="muted" aria-live="polite"></span>
      <button id="refresh" type="button" title="Check for new data now">Refresh</button>
      <button id="theme" type="button" title="Toggle light / dark">Theme</button>
    </div>
  </header>
  <nav id="sections" class="sections" aria-label="Sections" hidden></nav>
  <main id="grid">
    <p id="boot" class="muted">Loading…</p>
  </main>
  <noscript><p class="muted">This dashboard needs JavaScript.</p></noscript>
  <script src="vendor/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
