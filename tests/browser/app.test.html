<!doctype html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body>
  <iframe id="f" style="width: 1300px; height: 900px; border: 0"></iframe>
  <pre id="results">pending</pre>
  <script type="module">
    // App-level tests: loads the real index.html (with fixture data from tests/test_browser.py) in an iframe.
    const results = [];
    async function t(name, fn) {
      try { await fn(); results.push({ name, ok: true }); }
      catch (e) { results.push({ name, ok: false, err: String((e && e.stack) || e) }); }
    }
    const eq = (a, b, msg = "") => {
      const A = JSON.stringify(a), B = JSON.stringify(b);
      if (A !== B) throw new Error(`${msg} expected ${B} got ${A}`);
    };
    const ok = (c, msg = "assertion failed") => { if (!c) throw new Error(msg); };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const frame = document.getElementById("f");
    const doc = () => frame.contentDocument;
    async function until(cond, what, ms = 8000) {
      for (let waited = 0; waited < ms; waited += 50) {
        try { if (cond()) return; } catch (e) { /* not ready */ }
        await sleep(50);
      }
      throw new Error(`timed out waiting for ${what}`);
    }
    async function load(url) {
      frame.src = "about:blank";
      await sleep(50);
      frame.src = url;
      await until(() => doc().body.dataset.state === "ready" && doc().querySelector("#sections a"), `${url} ready`);
    }
    const visible = () => [...doc().querySelectorAll(".card")].filter((c) => !c.hidden).map((c) => c.id.slice(2));
    const navTo = async (id) => {
      frame.contentWindow.location.hash = id;
      await until(() => doc().querySelector(`#sections a[href="#${id}"]`).classList.contains("active"), `section ${id}`);
    };
    const pin = (id) => doc().querySelector(`#w-${id} .pin`);

    localStorage.clear();

    await t("home is the default section and shows the default pins", async () => {
      await load("/index.html");
      eq([...doc().querySelectorAll("#sections a")].map((a) => a.textContent), ["Home", "Markets & Economy", "News", "Gas Prices"]);
      eq(doc().querySelector("#sections a.active").textContent, "Home");
      eq(visible(), ["gas-a", "mkt"]);
      eq(pin("mkt").getAttribute("aria-pressed"), "true");
      eq(pin("news-a").getAttribute("aria-pressed"), "false");
    });

    await t("each section shows its own widgets", async () => {
      await navTo("markets"); eq(visible(), ["mkt", "chart"]);
      await navTo("news"); eq(visible(), ["news-a"]);
      await navTo("gas"); eq(visible(), ["gas-a"]);
      ok(frame.contentDocument.title.startsWith("Gas Prices"), frame.contentDocument.title);
      await navTo("home"); eq(visible(), ["gas-a", "mkt"]);
    });

    await t("a chart rendered while hidden is sized once its section is shown", async () => {
      await navTo("markets");
      const canvas = doc().querySelector("#w-chart canvas");
      await until(() => canvas.clientWidth > 200 && frame.contentWindow.Chart.getChart(canvas).width > 200, "chart resize");
      const ch = frame.contentWindow.Chart.getChart(canvas);
      ok(ch.data.datasets.some((d) => d.label === "volume"), "volume pane");
    });

    await t("unpin from Home hides it there and is remembered", async () => {
      await navTo("home");
      pin("mkt").click();
      eq(visible(), ["gas-a"]);
      eq(JSON.parse(localStorage.getItem("dash:pins")), { mkt: false });
      await navTo("markets");
      eq(visible(), ["mkt", "chart"], "still in its own section");
      eq(pin("mkt").textContent, "☆");
    });

    await t("pin another widget from its section", async () => {
      await navTo("news");
      pin("news-a").click();
      eq(pin("news-a").getAttribute("aria-pressed"), "true");
      eq(visible(), ["news-a"], "stays visible in its section");
      await navTo("home");
      eq(visible(), ["gas-a", "news-a"]);
    });

    await t("pins survive a reload", async () => {
      await load("/index.html");
      eq(visible(), ["gas-a", "news-a"]);
      eq(JSON.parse(localStorage.getItem("dash:pins")), { mkt: false, "news-a": true });
    });

    await t("re-pinning a default pin forgets the override", async () => {
      pin("mkt").click();
      eq(JSON.parse(localStorage.getItem("dash:pins")), { "news-a": true });
      eq(visible(), ["gas-a", "mkt", "news-a"]);
    });

    await t("empty Home explains how to pin", async () => {
      for (const id of ["gas-a", "mkt", "news-a"]) pin(id).click();
      eq(visible(), []);
      const msg = doc().getElementById("empty-section");
      ok(msg && !msg.hidden && msg.textContent.includes("pin"), "empty message");
      localStorage.removeItem("dash:pins");   // back to config defaults for the next tests
    });

    await t("a direct link to a section opens it", async () => {
      await load("/index.html#news");
      eq(doc().querySelector("#sections a.active").textContent, "News");
      eq(visible(), ["news-a"]);
    });

    await t("11h-old data: no 'stuck' warning", async () => {
      await load("/index.html");
      const g = doc().getElementById("generated");
      ok(!g.classList.contains("stale"), g.textContent);
      ok(/Data collected 11h ago/.test(g.textContent), g.textContent);
    });

    await t("13h-old data: header warns that collection may be stuck", async () => {
      await load("/stale/index.html");
      const g = doc().getElementById("generated");
      ok(g.classList.contains("stale"), "stale class");
      ok(g.textContent.includes("collection may be stuck"), g.textContent);
    });

    await t("the deploy build (versioned code URLs) loads one copy of each module and works", async () => {
      const scripts = [...doc().querySelectorAll("script[src]")].map((s) => s.getAttribute("src"));
      ok(scripts.includes("js/app.js?v=test123"), JSON.stringify(scripts));
      const mods = frame.contentWindow.performance.getEntriesByType("resource").map((r) => r.name).filter((n) => n.includes("/js/"));
      ok(mods.length > 5 && mods.every((n) => n.endsWith("?v=test123")), JSON.stringify(mods));
      ok(new Set(mods).size === mods.length, "no module loaded twice");
      doc().getElementById("layout").click();
      ok(doc().body.classList.contains("editing"), "Layout button works");
      ok(frame.contentWindow.Chart.getChart(doc().querySelector("#w-chart canvas")), "renderers work");
      localStorage.clear();
    });


    // ------------------------------------------------------------ layout: reorder + export
    const order = () => JSON.parse(localStorage.getItem("dash:order") || "null");
    const tool = (id, cls) => doc().querySelector(`#w-${id} .${cls}`);
    const shownEl = (n) => n && n.offsetParent !== null;

    await t("layout mode: controls appear, ↑ / ↓ reorder this tab only, and it is remembered", async () => {
      localStorage.removeItem("dash:pins"); localStorage.removeItem("dash:order");
      await load("/index.html#markets");
      ok(!shownEl(tool("mkt", "move-up")), "move buttons hidden until Layout is on");
      doc().getElementById("layout").click();
      ok(doc().body.classList.contains("editing"), "editing");
      ok(!doc().getElementById("layout-bar").hidden, "help bar");
      ok(shownEl(tool("mkt", "move-up")) && shownEl(tool("mkt", "drag")), "controls shown");
      ok(tool("mkt", "move-up").disabled && !tool("mkt", "move-down").disabled, "first card can't go up");
      ok(tool("chart", "move-down").disabled, "last card can't go down");
      ok(doc().getElementById("layout-reset").disabled, "nothing to reset yet");
      tool("chart", "move-up").click();
      eq(visible(), ["chart", "mkt"]);
      eq(order(), { markets: ["chart", "mkt"] });
      ok(!doc().getElementById("layout-reset").disabled, "reset enabled");
      ok(tool("chart", "move-up").disabled, "buttons follow the new order");
      await navTo("home");
      eq(visible(), ["gas-a", "mkt"], "Home keeps its own order");
      await load("/index.html#markets");
      eq(visible(), ["chart", "mkt"], "after reload");
      ok(!doc().body.classList.contains("editing"), "layout mode is off after a reload");
    });

    await t("moving a card back to the default order forgets the override", async () => {
      doc().getElementById("layout").click();
      tool("chart", "move-down").click();
      eq(visible(), ["mkt", "chart"]);
      eq(order(), null);
      tool("chart", "move-up").click();
      eq(order(), { markets: ["chart", "mkt"] });
    });

    await t("drag a card with the pointer (mouse or touch)", async () => {
      await navTo("home");
      const win = frame.contentWindow;
      const a = doc().getElementById("w-gas-a"), b = doc().getElementById("w-mkt");
      const h = tool("gas-a", "drag").getBoundingClientRect(), r = b.getBoundingClientRect();
      const ev = (type, x, y) => new win.PointerEvent(type, { bubbles: true, clientX: x, clientY: y, pointerId: 7,
        pointerType: "touch", isPrimary: true });
      tool("gas-a", "drag").dispatchEvent(ev("pointerdown", h.x + 2, h.y + 2));
      ok(a.classList.contains("dragging"), "dragging style");
      win.dispatchEvent(ev("pointermove", r.right - 8, r.top + r.height / 2));
      eq(visible(), ["mkt", "gas-a"], "moves while dragging");
      win.dispatchEvent(ev("pointerup", r.right - 8, r.top + r.height / 2));
      ok(!a.classList.contains("dragging"), "drop");
      eq(order(), { markets: ["chart", "mkt"], home: ["mkt", "gas-a"] });
      tool("gas-a", "drag").dispatchEvent(new win.PointerEvent("pointerdown", { bubbles: true, button: 2, pointerType: "mouse" }));
      ok(!a.classList.contains("dragging"), "right mouse button doesn't drag");
    });

    await t("a newly pinned widget goes after the ones before it by default", async () => {
      await navTo("news");
      pin("news-a").click();
      await navTo("home");
      eq(visible(), ["mkt", "gas-a", "news-a"]);
    });

    await t("a data refresh keeps the order", async () => {
      await frame.contentWindow.__dashboard.refresh();
      eq(visible(), ["mkt", "gas-a", "news-a"]);
      await navTo("markets");
      eq(visible(), ["chart", "mkt"]);
    });

    await t("Reset order: back to the default for this tab only", async () => {
      await navTo("home");
      doc().getElementById("layout-reset").click();
      eq(visible(), ["gas-a", "mkt", "news-a"]);
      eq(order(), { markets: ["chart", "mkt"] });
      ok(doc().getElementById("layout-reset").disabled, "nothing left to reset here");
    });

    await t("Done and Escape leave layout mode", async () => {
      doc().getElementById("layout-done").click();
      ok(!doc().body.classList.contains("editing") && doc().getElementById("layout-bar").hidden, "Done");
      doc().getElementById("layout").click();
      doc().dispatchEvent(new frame.contentWindow.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      ok(!doc().body.classList.contains("editing"), "Escape");
      eq(doc().getElementById("layout").getAttribute("aria-pressed"), "false");
    });

    await t("export is hidden: no button and no dialog without ?export", async () => {
      ok(!doc().getElementById("export"), "no dialog");
      ok(![...doc().querySelectorAll("button, a")].some((b) => /export/i.test(b.textContent)), "no export button");
    });

    await t("?export shows this browser's layout as JSON", async () => {
      localStorage.setItem("dash:ui:chart", JSON.stringify({ tab: "AAA", period: "1M" }));
      await load("/index.html?export#news");
      await until(() => doc().getElementById("export") && doc().getElementById("export").open, "export dialog");
      const ta = doc().querySelector("#export textarea");
      const x = JSON.parse(ta.value);
      eq(x.dashboard_layout, 1);
      eq(x.home, ["gas-a", "mkt", "news-a"]);
      eq(x.sections, { markets: ["chart", "mkt"], news: ["news-a"], gas: ["gas-a"] });
      eq(x.local_changes, { pins: { "news-a": true }, order: { markets: ["chart", "mkt"] } });
      eq(x.widget_ui.chart, { tab: "AAA", period: "1M" });
      ok(!Number.isNaN(Date.parse(x.exported)), "timestamp");
      eq(ta.selectionEnd - ta.selectionStart, ta.value.length, "text selected for copying");
      eq(doc().querySelector("#sections a.active").textContent, "News", "page still works underneath");
      doc().querySelector("#export button").click();
      await until(() => !doc().getElementById("export").open, "dialog closes");
      localStorage.clear();
    });

    document.getElementById("results").textContent = JSON.stringify(results);
  </script>
</body>
</html>
